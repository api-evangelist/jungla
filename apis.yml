name: Jungla
description: >-
  Jungla, Inc. was a San Francisco precision-medicine informatics startup
  founded in 2016 by Alexander Colavin and Carlos Araya. Backed by Andreessen
  Horowitz (a16z) and IndieBio, it built a cloud-based Functional Modeling
  Platform (FMP), also described as a Molecular Evidence Platform, that combined
  functional genomics, computational biophysics, cellular engineering, and
  machine learning to produce auditable predictive models for clinical genetic
  and genomic variant interpretation. Jungla emerged from stealth in 2018 and
  was acquired by Invitae Corporation in July 2019 (approximately $59M), where
  its technology augmented Invitae's Sherloc variant-classification approach.
  The company is now defunct; its original developer surface (jungla.io) is
  offline and no public API, documentation, or SDKs survive. This profile is a
  historical record surfaced from the a16z portfolio; it carries no live
  developer artifacts.
